name: CI
on:
  pull_request:
  push:
    branches: [main, 'oz-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: VHDL and analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install simulation and plotting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          python -m pip install -r requirements.txt
          ghdl --version
          python --version
      - name: Verify vectors, Python tests, RTL units, full sweep, and plots
        run: make check PYTHON=python
      - name: Retain measurements, logs, and analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/raw/
            build/ghdl/*.txt
            build/ghdl_units/*.txt
          if-no-files-found: warn
          retention-days: 30
